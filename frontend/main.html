<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Startup Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
    <button id="logout">Logout</button>
</div>

<div class="container">

    <!-- Ліва колонка: список ідей -->
    <aside class="sidebar">
        <h3>My Ideas</h3>
        <div id="ideasList"></div>
    </aside>

    <!-- Центральна частина: форма і результати -->
    <main class="main">
        <h3>New Idea</h3>
        <textarea id="ideaText" rows="4" placeholder="Describe your startup idea..."></textarea>
        <button id="analyzeBtn">Analyze</button>
        <div id="loading" 
        style="display: none; color: #4a69bd; margin-top: 10px;">⏳ Analyzing... Please wait.</div>

        <div class="analysis-block">
            <h3>Analysis Result</h3>

            <h4>Need:</h4>
            <pre id="need"></pre>

            <h4>Solution:</h4>
            <pre id="solution"></pre>

            <h4>Benefit:</h4>
            <pre id="benefit"></pre>

            <h4>Competitors:</h4>
            <pre id="competitors"></pre>
        </div>
    </main>

</div>

<!-- Підключаємо app.js з усіма функціями логіки -->
<script src="app.js"></script>

</body>
</html>
